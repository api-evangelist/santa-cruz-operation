name: Santa Cruz Operation
description: Santa Cruz Operation (SCO) was an American software company founded in 1979 in Santa Cruz,
  California, best known for its Unix operating systems for Intel x86 hardware — Xenix (developed with
  Microsoft), SCO UNIX, SCO OpenServer, and UnixWare. The company later reorganized as Tarantella, Inc.
  and The SCO Group, which became widely known for the SCO v. IBM Linux litigation beginning in 2003. The
  SCO Group filed for Chapter 11 bankruptcy in 2007, and its Unix product assets were subsequently sold to
  UnXis, later renamed Xinuos. The historic Santa Cruz Operation is defunct and operates no modern
  developer platform or public API; this record is retained for network completeness.
